name: CI

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
  pull_request:
    types:
      - opened
      - synchronize
      - ready_for_review
    paths-ignore:
      - "*.md"
  schedule:
    - cron: 0 16 * * *

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update Submodule
        run: git submodule update --init --recursive

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: install magick
        run: choco install imagemagick

      - name: build
        run: |
          foreach ($v in 2018..2025) {
            Write-Output "::group::Build $v"
            $env:RevitVersion=$v
            dotnet build --configuration Release
            Write-Output "::endgroup::"
          }

      # upload
      - name: pack
        run: Compress-Archive -Path ./bin/Mason -DestinationPath ./bin/Mason.zip -PassThru

      - uses: actions/upload-artifact@v4
        with:
          name: Mason
          path: bin/Mason.zip
          if-no-files-found: error
